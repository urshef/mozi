<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egy fontos kérdés...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin: 0;
        }

        .container-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .title {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px; /* Hely fenntartása a gomboknak */
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4);
        }

        .btn-no {
            background: #f1f2f6;
            color: #747d8c;
            position: absolute;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
        }

        @keyframes fall {
            0% { opacity: 1; transform: translateY(-100vh) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
        }

        #success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart {
            font-size: 4rem;
            color: #ff6b81;
            animation: beat 1s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        /* Lebegő elemek a háttérben */
        .floating-icon {
            position: absolute;
            opacity: 0.1;
            font-size: 3rem;
            animation: float 6s infinite ease-in-out;
            z-index: 1;
        }
        
        .floating-icon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; z-index: 20; cursor: default; user-select: none; -webkit-tap-highlight-color: transparent; }
        .floating-icon:nth-child(2) { top: 20%; right: 15%; font-size: 4rem; animation-delay: 1s; }
        .floating-icon:nth-child(3) { bottom: 15%; left: 20%; font-size: 2.5rem; animation-delay: 2s; }
        .floating-icon:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 3s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        #calendar-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            font-weight: bold;
            color: #333;
        }

        .calendar-nav {
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 10px;
            background: #f1f2f6;
            transition: 0.2s;
            user-select: none;
        }
        
        .calendar-nav:hover {
            background: #dfe4ea;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
            margin-bottom: 20px;
        }

        .calendar-day-header {
            font-size: 0.8rem;
            color: #888;
            font-weight: 600;
            padding-bottom: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #333;
        }

        .calendar-day:hover:not(.empty):not(.disabled) {
            background-color: #fecfef;
        }

        .calendar-day.selected {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 100%);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
        }
        
        .calendar-day.disabled {
            color: #ccc;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .calendar-day.empty {
            cursor: default;
        }

    </style>
</head>
<body>

    <div class="floating-icon">🍿</div>
    <div class="floating-icon">🎬</div>
    <div class="floating-icon">🥤</div>
    <div class="floating-icon">🎟️</div>

    <div class="container-box" id="main-card">
        <div id="question-screen">
            <h1 class="title">Szia mamája! 😊</h1>
            <p class="subtitle">Lenne kedved eljönni velem moziba valamikor?</p>
            
            <div class="buttons-container">
                <button class="btn btn-yes" id="yes-btn">Persze, nyilván! 🍿</button>
                <button class="btn btn-no" id="no-btn">Nem...</button>
            </div>
        </div>

        <div id="calendar-screen">
            <h2 class="title" style="font-size: 1.8rem;">Gondoltam! 🎉</h2>
            <p class="subtitle" style="margin-bottom: 20px;">Melyik nap lenne jó neked?</p>
            
            <div class="calendar-header">
                <div class="calendar-nav" id="prev-month">&lt;</div>
                <div id="month-year-display"></div>
                <div class="calendar-nav" id="next-month">&gt;</div>
            </div>
            
            <div class="calendar-grid" id="calendar-days">
                <!-- Javascript generálja ide a napokat -->
            </div>

            <button class="btn btn-yes mt-4" id="confirm-date-btn" style="display: none; width: 100%;">Ezt a napot választom! 🎬</button>
        </div>

        <div id="success-screen">
            <div class="heart">❤️</div>
            <h1 class="title">Tökéletes! 🎉</h1>
            <p class="subtitle" id="final-date-text">Nagyon kiályság!</p>
            <div class="text-sm text-gray-500 mt-4">Várom a talit! 😊</div>
        </div>
    </div>

    <div id="admin-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 90%; width: 350px;">
            <h3 style="font-size: 1.5rem; margin-bottom: 15px; font-weight: bold; color: #333;">Titkos infó 🕵️‍♂️</h3>
            <p id="admin-result" style="margin-bottom: 20px; font-size: 1.1rem; color: #666;">Betöltés...</p>
            <button id="close-admin" class="btn btn-yes" style="padding: 10px 20px;">Bezárás</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // A te saját Firebase konfigurációd
        const firebaseConfig = {
            apiKey: "AIzaSyBevMx2fjaL9tGDc8B4JJKmv0ZVV6YU89s",
            authDomain: "mozi-4c63a.firebaseapp.com",
            projectId: "mozi-4c63a",
            storageBucket: "mozi-4c63a.firebasestorage.app",
            messagingSenderId: "11419905959",
            appId: "1:11419905959:web:55af16e1f1e6d211d59082",
            measurementId: "G-2FWLC2G37V"
        };
        
        const appId = "sajat_mozi_app"; // Ezt így hagyhatod
        const authToken = null; // Ide is null kell, hogy az Anonymous auth fusson le

        let app, db, auth;
        let isFirebaseReady = false;

        // Háttérben lévő felhő inicializálása
        if (Object.keys(firebaseConfig).length > 0) {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                const authPromise = authToken 
                    ? signInWithCustomToken(auth, authToken) 
                    : signInAnonymously(auth);
                    
                authPromise.then(() => {
                    isFirebaseReady = true;
                }).catch(e => console.error("Hitelesítési hiba", e));
            } catch (e) {
                console.error("Adatbázis indulási hiba", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const questionScreen = document.getElementById('question-screen');
            const successScreen = document.getElementById('success-screen');
            const buttonsContainer = document.querySelector('.buttons-container');

            // Beállítjuk a 'Nem' gombot az 'Igen' gomb mellé kezdetben
            function initButtons() {
                // Megvárjuk amíg kirajzolódik
                setTimeout(() => {
                    const yesRect = yesBtn.getBoundingClientRect();
                    const containerRect = buttonsContainer.getBoundingClientRect();
                    
                    // A 'Nem' gombot az 'Igen' gomb után tesszük
                    noBtn.style.left = `calc(50% + ${yesRect.width / 2 + 10}px)`; 
                }, 100);
            }
            initButtons();

            // Trükkös 'Nem' gomb: elugrik az egér elől
            const moveNoButton = (e) => {
                const containerRect = document.querySelector('.container-box').getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();

                // Kiszámolunk egy új, véletlenszerű pozíciót a dobozon belül
                const maxX = containerRect.width - btnRect.width - 20;
                const maxY = containerRect.height - btnRect.height - 20;

                const randomX = Math.max(10, Math.random() * maxX);
                const randomY = Math.max(10, Math.random() * maxY);

                noBtn.style.position = 'absolute';
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
                noBtn.style.transform = `rotate(${Math.random() * 20 - 10}deg)`; // Kicsi forgatás
            };

            noBtn.addEventListener('mouseover', moveNoButton);
            noBtn.addEventListener('touchstart', moveNoButton, {passive: true});

            const calendarScreen = document.getElementById('calendar-screen');
            const monthYearDisplay = document.getElementById('month-year-display');
            const calendarDays = document.getElementById('calendar-days');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const confirmDateBtn = document.getElementById('confirm-date-btn');
            const finalDateText = document.getElementById('final-date-text');

            let currentDate = new Date();
            let selectedDates = []; // Több nap tárolására
            const monthNames = ["Január", "Február", "Március", "Április", "Május", "Június", "Július", "Augusztus", "Szeptember", "Október", "November", "December"];

            function renderCalendar() {
                const dayHeaders = `
                    <div class="calendar-day-header">H</div>
                    <div class="calendar-day-header">K</div>
                    <div class="calendar-day-header">Sze</div>
                    <div class="calendar-day-header">Cs</div>
                    <div class="calendar-day-header">P</div>
                    <div class="calendar-day-header">Szo</div>
                    <div class="calendar-day-header">V</div>
                `;
                calendarDays.innerHTML = dayHeaders;

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                monthYearDisplay.textContent = `${year}. ${monthNames[month]}`;

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                // A hét hétfővel kezdődik nálunk
                let startDay = firstDay === 0 ? 6 : firstDay - 1;

                const today = new Date();
                today.setHours(0,0,0,0);

                // Üres cellák a hónap elején
                for (let i = 0; i < startDay; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.classList.add('calendar-day', 'empty');
                    calendarDays.appendChild(emptyDiv);
                }

                // Napok renderelése
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.classList.add('calendar-day');
                    dayDiv.textContent = i;
                    
                    const thisDate = new Date(year, month, i);
                    
                    if (thisDate < today) {
                        // Elmúlt napok kikapcsolása
                        dayDiv.classList.add('disabled');
                    } else {
                        // Kijelölés vizuális megtartása hónapváltáskor
                        const isSelected = selectedDates.some(d => d.getTime() === thisDate.getTime());
                        if (isSelected) {
                            dayDiv.classList.add('selected');
                        }

                        dayDiv.addEventListener('click', () => {
                            const index = selectedDates.findIndex(d => d.getTime() === thisDate.getTime());
                            
                            if (index > -1) {
                                // Ha már ki volt választva, kivesszük a listából és levesszük a stílust
                                selectedDates.splice(index, 1);
                                dayDiv.classList.remove('selected');
                            } else {
                                // Ha még nem volt, betesszük a listába és stílust adunk neki
                                selectedDates.push(thisDate);
                                dayDiv.classList.add('selected');
                            }
                            
                            // Ha van legalább egy kiválasztott nap, mutassuk a gombot
                            if (selectedDates.length > 0) {
                                confirmDateBtn.style.display = 'block';
                            } else {
                                confirmDateBtn.style.display = 'none';
                            }
                        });
                    }
                    calendarDays.appendChild(dayDiv);
                }
            }

            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            // 'Igen' gomb kattintása -> Naptár mutatása
            yesBtn.addEventListener('click', () => {
                questionScreen.style.display = 'none';
                calendarScreen.style.display = 'flex';
                renderCalendar();
            });

            // Naptár jóváhagyása
            confirmDateBtn.addEventListener('click', async () => {
                if (selectedDates.length > 0) {
                    // Időrendbe rakjuk a kiválasztott napokat
                    selectedDates.sort((a, b) => a - b);
                    
                    const options = { month: 'long', day: 'numeric' };
                    const dateStrs = selectedDates.map(d => d.toLocaleDateString('hu-HU', options));
                    const joinedDates = dateStrs.join(', ');
                    
                    finalDateText.textContent = `Akkor beírva a naptárba: ${joinedDates}! Hamarosan egyeztetjük a részleteket.`;
                    
                    // Titkos mentés az adatbázisba
                    if (isFirebaseReady && auth.currentUser) {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'movie_dates', 'latest');
                            await setDoc(docRef, { 
                                selectedDate: dateStrs, // Most már egy tömböt mentünk
                                timestamp: new Date().toISOString() 
                            });
                        } catch (e) {
                            console.error("Nem sikerült elmenteni az adatot.", e);
                        }
                    }
                }
                calendarScreen.style.display = 'none';
                successScreen.style.display = 'flex';
                createConfetti();
            });

            // Titkos gomb funkció (Kattints 5x a Popcorn-ra)
            let secretClicks = 0;
            const popcornIcon = document.querySelector('.floating-icon:nth-child(1)');
            const adminModal = document.getElementById('admin-modal');
            const adminResult = document.getElementById('admin-result');
            const closeAdminBtn = document.getElementById('close-admin');

            popcornIcon.addEventListener('click', async () => {
                secretClicks++;
                if (secretClicks >= 5) {
                    secretClicks = 0; // Nullázzuk, hogy újra lehessen használni
                    adminModal.style.display = 'flex';
                    adminResult.textContent = 'Adatok lekérdezése...';
                    
                    if (isFirebaseReady && auth.currentUser) {
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'movie_dates', 'latest');
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                const data = docSnap.data();
                                let datesToShow = "";
                                
                                // Kezeljük azt az esetet is, ha tömb, és ha régi string lenne
                                if (Array.isArray(data.selectedDate)) {
                                    datesToShow = data.selectedDate.join('<br>');
                                } else {
                                    datesToShow = data.selectedDate;
                                }
                                
                                adminResult.innerHTML = `Ezeket a napokat választotta:<br><strong style="font-size:1.5rem; color:#ff6b81; display:block; margin-top:10px;">${datesToShow}</strong>`;
                            } else {
                                adminResult.textContent = 'Még nem választott napot.';
                            }
                        } catch(e) {
                             adminResult.textContent = 'Hiba történt a beolvasáskor.';
                        }
                    } else {
                        adminResult.textContent = 'Adatbázis nem elérhető.';
                    }
                }
            });

            closeAdminBtn.addEventListener('click', () => {
                adminModal.style.display = 'none';
            });

            // Konfetti készítő funkció
            function createConfetti() {
                const colors = ['#ff9a9e', '#fecfef', '#a18cd1', '#fbc2eb', '#84fab0', '#8fd3f4'];
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    
                    // Véletlenszerű szín
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Véletlenszerű kezdeti pozíció
                    confetti.style.left = `${Math.random() * 100}vw`;
                    
                    // Véletlenszerű méret
                    const size = Math.random() * 10 + 5;
                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    
                    // Forma (kerek vagy négyzet)
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '50%';
                    }
                    
                    // Animáció paraméterei
                    const duration = Math.random() * 3 + 2; // 2-5 másodperc
                    const delay = Math.random() * 2;
                    confetti.style.animation = `fall ${duration}s linear ${delay}s forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    // Eltávolítás az animáció után
                    setTimeout(() => {
                        confetti.remove();
                    }, (duration + delay) * 1000);
                }
            }
        });
    </script>
</body>
</html>
